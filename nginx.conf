server {
  listen 1221;
  server_name _;

  root   /usr/share/nginx/html;
  index  index.html;

  # 前端路由回退：/library/xxx 等深层链接刷新不 404
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 带内容哈希的资源，长缓存
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}